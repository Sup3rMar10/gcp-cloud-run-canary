# The Cloud Run service definition, in the Knative format `gcloud run services replace service.yaml` takes.
# Reference only: it has never been applied to a real project (IMAGE is a placeholder the pipeline substitutes).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: orders
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"      # one warm instance, so a cold start is not what users meet first
        autoscaling.knative.dev/maxScale: "20"     # a cap, so a traffic spike (or a loop) cannot spend without limit
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      serviceAccountName: runtime@PROJECT.iam.gserviceaccount.com
      containers:
        - image: IMAGE
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1"
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
            periodSeconds: 2
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
            periodSeconds: 10

name: deploy

# Reference pipeline, NEVER RUN against a real Google Cloud project. Skipped unless the repository variable
# GCP_WIF_PROVIDER is set (see the gcp-wif-github-deploy repository for the keyless setup this assumes).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rollout:
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push the image
        env:
          REGION: ${{ vars.GCP_REGION }}
          IMAGE_BASE: ${{ vars.GCP_IMAGE_BASE }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE_BASE}:${GITHUB_SHA}" app
          docker push "${IMAGE_BASE}:${GITHUB_SHA}"
      - name: Gradual rollout (candidate, smoke test, 10% then 50% then 100%, rollback on errors)
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          IMAGE_BASE: ${{ vars.GCP_IMAGE_BASE }}
        run: |
          python -m pip install google-cloud-monitoring
          python -m rollout deploy --project "$PROJECT" --region "$REGION" --service "$SERVICE" --image "${IMAGE_BASE}:${GITHUB_SHA}"
